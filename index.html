<!DOCTYPE html>
<html>
<head>
    <title>Happy Birthday ❤️</title>

    <style>
        body{
            text-align:center;
            background:#FFF8DC;
            font-family:Arial;
            padding:50px;
        }

        h1{
            color:#ff4081;
            font-size:50px;
        }

        p{
            font-size:22px;
        }

        img{
            width:300px;
            border-radius:20px;
        }

        .heart{
            animation:pulse 1s infinite;
            font-size:40px;
        }

        @keyframes pulse{
            50%{
                transform:scale(1.2);
            }
        }
    </style>

</head>

<body>

<h1>🎉 Happy Birthday Sayang 🎉</h1>

<img src="cover.jpeg">

<p>
Terima kasih sudah menjadi orang terbaik dalam hidupku ❤️
</p>

<p>
Semoga tahun ini penuh kebahagiaan dan impian yang tercapai.
</p>

<div class="heart">
💛💛💛
</div>

</body>
</html>
